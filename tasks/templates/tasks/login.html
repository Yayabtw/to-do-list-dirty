<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Connexion - My Watch List</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<style>
		body { background-color: #3a86ff; }
		.center-column {
			width: 600px;
			margin: 20px auto;
			padding: 20px;
			background-color: #fff;
			border-radius: 3px;
			box-shadow: 6px 2px 30px 0px rgba(0,0,0,0.75);
		}
		input { width: 100%; padding: 12px 20px; margin: 8px 0; box-sizing: border-box; }
		.btn-info { background-color: #0056b3; border-color: #004085; color: #fff; }
		.btn-info:hover { background-color: #004085; color: #fff; }
	</style>
</head>
<body>
	<h1 style="text-align: center; color: #fb5607; font-size: 125px; text-shadow: -10px 0 black, 0 10px black, 10px 0 black, 0 -10px black;">MY WATCH LIST</h1>
	<div class="center-column">
		<h2>Connexion</h2>
		{% if form.errors %}
		<p class="text-danger">Identifiant ou mot de passe incorrect.</p>
		{% endif %}
		<form method="post" action="{% url 'login' %}">
			{% csrf_token %}
			<table>
				<tr>
					<td>{{ form.username.label_tag }}</td>
					<td>{{ form.username }}</td>
				</tr>
				<tr>
					<td>{{ form.password.label_tag }}</td>
					<td>{{ form.password }}</td>
				</tr>
			</table>
			<input type="hidden" name="next" value="{{ next }}">
			<button type="submit" class="btn btn-info mt-2">Se connecter</button>
		</form>
		<p class="mt-3">Pas encore de compte ? <a href="{% url 'register' %}">Créer un compte</a></p>
	</div>
</body>
</html>
